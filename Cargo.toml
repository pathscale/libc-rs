[package]
name = "libc-rs"
version = "0.2.3"
publish = ["crates-io"]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Pure-Rust no_std native runtime and capability call substrate for unikernel environments"
repository = "https://github.com/pathscale/libc-rs"
readme = "README.md"
exclude = [".github/**"]
keywords = ["unikernel", "no-std", "runtime", "aarch64", "syscall"]
categories = ["no-std", "os"]

[features]
default = ["alloc"]
alloc = []
# Export freestanding C-ABI memory/string symbols (`memcpy`, `memmove`, `memset`, `memcmp`, `bcmp`, `strlen`, `strnlen`)
# for `aarch64-unknown-none` targets.
symbols = []
